name: Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all services regardless of changes'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/irs

jobs:
  # detect which services have changes; other jobs can reference outputs
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      angular: ${{ steps.filter.outputs.angular }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      flask: ${{ steps.filter.outputs.flask }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            angular:
              - 'src/angular-ui/**'
            dotnet:
              - 'src/dotnet-api/**'
            flask:
              - 'src/flask-api/**'
            database:
              - 'src/database/**'
              - 'tools/db-deploy/**'

  # Build DACPAC from SQL Server project (requires Windows runner for legacy .sqlproj)
  build-dacpac:
    needs: [security-scan, detect-changes]
    # Always run on main to ensure image is always available on Docker Hub.
    # Also run on develop and when database files change on any branch.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      needs.detect-changes.outputs.database == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DACPAC
        run: msbuild "src\database\IRS\IRS.sqlproj" /p:Configuration=Release

      - name: Upload DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: irs-dacpac
          path: src/database/IRS/bin/Release/IRS.dacpac
          retention-days: 1

  # Build and push the db-deploy Docker image
  push-db-deploy-image:
    needs: [build-dacpac]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download DACPAC artifact
        uses: actions/download-artifact@v4
        with:
          name: irs-dacpac
          path: src/database/out

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-db-deploy"
          {
            echo 'tags<<EOF'
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "${IMAGE}:latest"
            else
              echo "${IMAGE}:dev"
            fi
            echo "${IMAGE}:${{ github.sha }}"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Build and push db-deploy image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tools/db-deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # First job: scan for secrets in code
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
      
      - name: Scan for exposed secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
          # when base and head are identical (e.g. tags) trufflehog will skip
          # scanning; omitting base/head forces a full repository scan
      
      - name: Scan appsettings files for hardcoded secrets
        run: |
          echo "Scanning for hardcoded credentials..."
          if grep -r "password\|secret\|apikey\|token" src/**/*.Development.json 2>/dev/null | grep -v '""'; then
            echo "❌ ERROR: Found potential secrets in Development config!"
            exit 1
          fi
          if grep -r "password\|secret\|apikey\|token" src/**/*.Test.json 2>/dev/null | grep -v '""'; then
            echo "❌ ERROR: Found potential secrets in Test config!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
      
      - name: Check .gitignore configuration
        run: |
          echo "Verifying .gitignore contains secret patterns..."
          grep -q "appsettings.Development.json" .gitignore || exit 1
          grep -q "appsettings.Production.json" .gitignore || exit 1
          grep -q "\.env" .gitignore || exit 1
          echo "✅ .gitignore properly configured"
  # Build images
  build:
    needs: [security-scan, detect-changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || (needs.detect-changes.outputs.angular == 'true' || needs.detect-changes.outputs.dotnet == 'true' || needs.detect-changes.outputs.flask == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        service: [dotnet-api, flask-api, angular-ui]
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Set image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}"
          {
            echo 'tags<<EOF'
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "${IMAGE}:latest"
            else
              echo "${IMAGE}:dev"
            fi
            echo "${IMAGE}:${{ github.sha }}"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.service }}
          file: ./src/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
      
      - name: Upload to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "✅ Image pushed to Docker Hub"
          echo "Repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}"
          echo "Tags: latest, ${{ github.sha }}"

  # Scan images for vulnerabilities
  scan-images:
    needs: [build, detect-changes]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      security-events: write
    
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan .NET API image
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true') || needs.detect-changes.outputs.dotnet == 'true' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dotnet-api:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-dotnet.sarif'
          severity: 'HIGH,CRITICAL'
      
      - name: Upload .NET SARIF
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true') || needs.detect-changes.outputs.dotnet == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-dotnet.sarif'
          category: 'trivy-dotnet'

      - name: Scan Flask API image
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true') || needs.detect-changes.outputs.flask == 'true' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-flask-api:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-flask.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Flask SARIF
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true') || needs.detect-changes.outputs.flask == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-flask.sarif'
          category: 'trivy-flask'

      - name: Scan Angular UI image
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true') || needs.detect-changes.outputs.angular == 'true' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-angular-ui:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-angular.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Angular SARIF
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true') || needs.detect-changes.outputs.angular == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-angular.sarif'
          category: 'trivy-angular'

      - name: Scan database image
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity HIGH,CRITICAL \
            mcr.microsoft.com/mssql/server:2022-latest || true

  # Integration tests
  test:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start containers
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 30  # Wait for services to start
      
      - name: Health check
        run: |
          echo "Checking .NET API health..."
          curl -f http://localhost:5000/api/health || exit 1
          
          echo "Checking Flask API health..."
          curl -f http://localhost:5001/health || exit 1
          
          echo "Checking Angular UI health..."
          curl -f http://localhost/index.html || exit 1
      
      - name: Run integration tests
        run: |
          docker compose exec -T dotnet-api dotnet test \
            src/IRS.Api.IntegrationTests/IRS.Api.IntegrationTests.csproj || true
      
      - name: Stop containers
        if: always()
        run: docker compose down -v

  # Deploy to VPS
  deploy:
    needs: [detect-changes, build, push-db-deploy-image]
    # Run if all required jobs either succeeded or were skipped; never run if cancelled.
    # Parentheses are critical here to avoid operator-precedence bugs with always().
    if: |
      always() && !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.push-db-deploy-image.result == 'success' || needs.push-db-deploy-image.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.vps.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 185.249.73.172
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.vps.yml"
          target: "/home/deploy/IRS"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.249.73.172
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /home/deploy/IRS
            # ensure the external network exists before compose tries to attach to it
            docker network create app-network || true
            force_deploy="${{ github.event.inputs.force_deploy }}"

            # ── Schema migration (one-shot; always run to ensure schema is up to date) ──
            # sqlpackage /Action:Publish is idempotent: it diffs the dacpac against the
            # live database and only applies missing changes. Fast no-op if nothing changed.
            if docker compose -f docker-compose.vps.yml pull db-deploy; then
              docker compose -f docker-compose.vps.yml run --rm db-deploy
              echo "✅ Schema migration complete"
            else
              echo "⚠️  db-deploy image not found on registry; skipping schema migration"
            fi

            # ── Application services ──
            pull_targets=""
            if [ "${{ needs.detect-changes.outputs.angular }}" = "true" ]; then pull_targets+=" angular-ui"; fi
            if [ "${{ needs.detect-changes.outputs.dotnet }}" = "true" ]; then pull_targets+=" dotnet-api"; fi
            if [ "${{ needs.detect-changes.outputs.flask }}" = "true" ]; then pull_targets+=" flask-api"; fi
            if [ "$force_deploy" = "true" ] || [ -n "$pull_targets" ]; then
              if [ "$force_deploy" = "true" ]; then
                docker compose -f docker-compose.vps.yml pull dotnet-api flask-api angular-ui
              else
                docker compose -f docker-compose.vps.yml pull $pull_targets
              fi
            else
              echo "No service changes detected; skipping pull."
            fi
            docker compose -f docker-compose.vps.yml up -d --force-recreate dotnet-api flask-api angular-ui
            docker image prune -f
            echo "✅ Deployed commit ${{ github.sha }}"

  # Deploy dev stack to VPS on push to develop
  deploy-dev:
    needs: build
    if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.dev-vps.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 185.249.73.172
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.dev-vps.yml"
          target: "/home/deploy/IRS-dev"

      - name: Copy nginx.dev.conf to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 185.249.73.172
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          source: "src/angular-ui/nginx.dev.conf"
          target: "/home/deploy/IRS-dev"

      - name: Deploy dev stack to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.249.73.172
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            # Flatten nginx.dev.conf from SCP-preserved path to /home/deploy/IRS-dev/ root
            mv -f /home/deploy/IRS-dev/src/angular-ui/nginx.dev.conf /home/deploy/IRS-dev/nginx.dev.conf 2>/dev/null || true
            cd /home/deploy/IRS-dev
            docker compose -f docker-compose.dev-vps.yml pull
            docker compose -f docker-compose.dev-vps.yml up -d --force-recreate
            docker image prune -f
            echo "✅ Dev deployed commit ${{ github.sha }}"

  # Notify on success
  notify:
    needs: [security-scan, build, deploy, deploy-dev]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify deployment success
        run: |
          echo "✅ Docker images built, pushed, and deployed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Images ready in: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
