services:
  # ──────────────────────────────────────────────
  # Database Deployment (SSDT dacpac)
  # SQL Server is assumed to be already running on app-network
  # ──────────────────────────────────────────────
  db-deploy:
    image: eshivakant/irs-db-deploy:latest
    container_name: db-deploy
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      TARGET_SERVER: "mssql"
    networks:
      - app-network

  # ──────────────────────────────────────────────
  # ASP.NET Core Web API
  # ──────────────────────────────────────────────
  dotnet-api:
    image: eshivakant/irs-dotnet-api:latest
    container_name: dotnet-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ConnectionStrings__DefaultConnection: "Server=mssql;Database=${DB_NAME};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;"
      Jwt__Key: "${JWT_SECRET_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      FlaskApi__BaseUrl: "http://flask-api:5001"
      OpenFigi__ApiKey: "${OPENFIGI_API_KEY}"
      LlmEncryption__Key: "${LLM_ENCRYPTION_KEY}"
      Encryption__Key: "${ENCRYPTION_KEY}"
      Encryption__IV: "${ENCRYPTION_IV}"
      Cors__AllowedOrigins__0: "http://${VPS_IP}"
      Cors__AllowedOrigins__1: "http://${VPS_DOMAIN}"
      Cors__AllowedOrigins__2: "https://${VPS_DOMAIN}"
      Cors__AllowedOrigins__3: "http://localhost"
      Cors__AllowedOrigins__4: "https://localhost"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=app-network"
      - "traefik.http.routers.irs-api.rule=Host(`irs.ruvca-investments.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.irs-api.entrypoints=websecure"
      - "traefik.http.routers.irs-api.tls=true"
      - "traefik.http.routers.irs-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.irs-api.loadbalancer.server.port=8080"

  flask-api:
    image: eshivakant/irs-flask-api:latest
    container_name: flask-api
    environment:
      FLASK_ENV: "production"
      DB_CONNECTION_STRING: "Driver={ODBC Driver 18 for SQL Server};Server=mssql;Database=${DB_NAME};Uid=sa;Pwd=${SA_PASSWORD};TrustServerCertificate=yes;"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      DOTNET_API_BASE_URL: "http://dotnet-api:8080"
      Yahoo_Fin_user: "${Yahoo_Fin_user}"
      Yahoo_fin_secret: "${Yahoo_fin_secret}"
      SECRET_KEY: "${SECRET_KEY}"
      BRAVE_API_TOKEN: "${BRAVE_API_TOKEN}"
      BRAVE_GOGGLES_URL: "${BRAVE_GOGGLES_URL}"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  angular-ui:
    image: eshivakant/irs-angular-ui:latest
    container_name: angular-ui
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=app-network"
      - "traefik.http.routers.irs-frontend.rule=Host(`irs.ruvca-investments.com`)"
      - "traefik.http.routers.irs-frontend.entrypoints=websecure"
      - "traefik.http.routers.irs-frontend.tls=true"
      - "traefik.http.routers.irs-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.irs-frontend.loadbalancer.server.port=80"

networks:
  app-network:
    external: true
    name: app-network
